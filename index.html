<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lernpfad zur 1. Klausur | Mathematik EF</title>
<style>
/* Lernpfad im Kursdesign UB-2.2: Kopfleiste mit Stationsweg; je Station Merke, Experiment mit Reglern, Aufgabenkarten */
:root {
  --bg: #F3F6F9; --surface: #FFFFFF; --ink: #16202A; --muted: #5A6675; --line: #D3DCE5; --line-strong: #A9B7C5;
  --math: #14567F; --math-bg: #EAF2F7; --math-ink: #FFFFFF;
  --merke: #B3261E; --merke-bg: #FBEDEA;
  --bsp: #1F6B3B; --bsp-bg: #EDF5EF;
  --loes: #374151; --loes-bg: #F0F2F4;
  --warn: #8A5300; --warn-bg: #FFF3D6;
  --g-base: #8D99A6; --g-main: #14567F; --g-mid: #6F9CC0; --g-line: #1F6B3B; --g-target: #C2410C; --g-d: #7C3AED; --g-alt: #B3261E;
  --grid: #E3E9EF; --grid2: #F0F3F6; --axis: #33404D; --logo: #1B1A19;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mfont: "Times New Roman", Times, "Cambria Math", serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E141A; --surface: #161F28; --ink: #E4EBF2; --muted: #9AA8B6; --line: #2A3744; --line-strong: #44566A;
    --math: #82BBE3; --math-bg: #132A3B; --math-ink: #0E141A;
    --merke: #F0A097; --merke-bg: #3A1D1A;
    --bsp: #86CF9D; --bsp-bg: #14301F;
    --loes: #CBD3DC; --loes-bg: #212B35;
    --warn: #F1C46E; --warn-bg: #36290F;
    --g-base: #7A8794; --g-main: #82BBE3; --g-mid: #4F7FA6; --g-line: #86CF9D; --g-target: #F59A62; --g-d: #B79BFF; --g-alt: #F0A097;
    --grid: #1F2B37; --grid2: #19232D; --axis: #A9B5C1; --logo: #E4EBF2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E141A; --surface: #161F28; --ink: #E4EBF2; --muted: #9AA8B6; --line: #2A3744; --line-strong: #44566A;
  --math: #82BBE3; --math-bg: #132A3B; --math-ink: #0E141A;
  --merke: #F0A097; --merke-bg: #3A1D1A;
  --bsp: #86CF9D; --bsp-bg: #14301F;
  --loes: #CBD3DC; --loes-bg: #212B35;
  --warn: #F1C46E; --warn-bg: #36290F;
  --g-base: #7A8794; --g-main: #82BBE3; --g-mid: #4F7FA6; --g-line: #86CF9D; --g-target: #F59A62; --g-d: #B79BFF; --g-alt: #F0A097;
  --grid: #1F2B37; --grid2: #19232D; --axis: #A9B5C1; --logo: #E4EBF2;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.55 var(--font); -webkit-text-size-adjust: 100%; }
button { font-family: inherit; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
button:focus-visible, .fld:focus-visible, input[type=range]:focus-visible { outline: 3px solid var(--math); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; line-height: 1.2; }
h1 { font-size: 32px; margin: 2px 0 6px; letter-spacing: -0.01em; }
h2 { font-size: 23px; margin: 0; }
h3 { font-size: 20px; }
code { font: 15px/1.4 ui-monospace, "SF Mono", Menlo, Consolas, monospace; background: var(--loes-bg); padding: 1px 6px; border-radius: 6px; white-space: nowrap; }
.muted { color: var(--muted); }
.small { font-size: 14px; margin: 0; }
.m { font-family: var(--mfont); font-size: 1.06em; }
.kicker { font-size: 12.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 0; }
.lead { font-size: 18px; color: var(--muted); margin: 0; max-width: 62ch; }
sup { font-size: .68em; line-height: 0; position: relative; top: -.55em; vertical-align: baseline; }
sub { font-size: .72em; line-height: 0; position: relative; top: .28em; vertical-align: baseline; }
.fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .9em; line-height: 1.15; margin: 0 .12em; }
.fr > span:first-child { border-bottom: 1.4px solid currentColor; padding: 0 .2em .06em; }
.fr > span:last-child { padding: .06em .2em 0; }
.quote { display: block; margin: 10px 0 2px; padding: 10px 14px; background: var(--math-bg); border-left: 4px solid var(--math); border-radius: 0 10px 10px 0; }
.rechnung { display: block; margin: 10px 0; padding: 10px 14px; background: var(--loes-bg); border-left: 4px solid var(--merke); border-radius: 0 10px 10px 0; font-family: var(--mfont); font-size: 1.04em; line-height: 1.7; }

/* Kopfleiste */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1160px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px; display: flex; align-items: center; flex-wrap: wrap; gap: 8px 18px; }
.brand { display: flex; flex-direction: column; line-height: 1.2; }
.brand .ttl { font-weight: 700; font-size: 18px; }
.path { display: flex; gap: 5px; overflow-x: auto; flex: 1 1 380px; min-width: 0; padding: 5px; scrollbar-width: none; position: relative; }
.path::-webkit-scrollbar { display: none; }
.dot { flex: 0 0 auto; min-width: 38px; height: 38px; padding: 0 9px; border-radius: 19px; border: 1.5px solid var(--line-strong); background: var(--surface); color: var(--ink); font: 600 15px var(--font); }
.dot.part { border-color: var(--math); color: var(--math); box-shadow: inset 0 0 0 1.5px var(--math); }
.dot.done { background: var(--bsp); border-color: var(--bsp); color: var(--surface); }
.dot.cur { outline: 3px solid var(--math); outline-offset: 2px; }
.top-r { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.prog { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.kbt { min-height: 40px; padding: 0 12px; border-radius: 10px; border: 1.5px solid var(--line-strong); background: var(--surface); color: var(--math); font: 600 14px var(--font); }

/* Kopfzeile wie auf den Unterrichtsblättern */
.kopf { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 6px 18px; padding-bottom: 8px; border-bottom: 1px solid var(--ink); margin-bottom: 18px; }
.kopf-l { display: flex; align-items: center; gap: 12px; min-width: 0; }
.kopf-schule, .kopf-r { display: grid; gap: 2px; min-width: 0; }
.logo { height: 54px; width: auto; flex: none; color: var(--logo); }
.logo path[style*="stroke-width:34"] { vector-effect: non-scaling-stroke; stroke-width: 1px !important; }
.kopf-r { text-align: right; }
.schule { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 6px; font-size: 12.5px; letter-spacing: .02em; text-transform: uppercase; }
.schule-name { font-weight: 700; }
.schule .sep { color: var(--line-strong); }
.schule-zusatz { color: var(--muted); font-weight: 500; }
.lehrer { font-size: 13.5px; color: var(--muted); }
.kurs { font-size: 12.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.stunde { font-size: 13.5px; font-weight: 600; color: var(--muted); }
@media (max-width: 520px) { .kopf-r { text-align: left; } .logo { height: 44px; } }

/* Seite */
.wrap { max-width: 1160px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 22px 140px; }
body.kp-open .wrap { padding-bottom: 360px; }
.station { display: grid; gap: 18px; }
.st-head { display: grid; gap: 2px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 14px; min-width: 0; }
.card-t { margin: 0; font-size: 21px; }
.merke { background: var(--merke-bg); border-left: 6px solid var(--merke); border-radius: 0 var(--r) var(--r) 0; padding: 14px 20px; }
.merke-t { color: var(--merke); font-weight: 700; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; }
.merke ul { margin: 8px 0 0; padding-left: 1.15em; display: grid; gap: 6px; font-size: 18px; }

/* Experiment */
.ex-grid { display: grid; gap: 16px; align-items: start; }
@media (min-width: 900px) { .ex-grid { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); } }
.ex-plot { min-width: 0; }
.plot { width: 100%; height: auto; max-height: 66vh; display: block; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.ex-ctrl { display: grid; gap: 4px; min-width: 0; align-content: start; }
.sl-box { display: grid; gap: 4px; }
.sl { display: grid; grid-template-columns: 3em 46px minmax(0, 1fr) 46px 4.2em; align-items: center; gap: 6px; }
.sl-l { font: italic 21px var(--mfont); text-align: right; padding-right: 4px; white-space: nowrap; }
.sl-word .sl-l { font: 600 14px var(--font); font-style: normal; }
.sl-b { width: 46px; height: 46px; border-radius: 50%; border: 1.5px solid var(--line-strong); background: var(--surface); color: var(--math); font: 600 22px var(--font); padding: 0; }
.sl-v { font: 600 19px var(--font); font-variant-numeric: tabular-nums; text-align: right; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 46px; background: transparent; margin: 0; }
input[type=range]::-webkit-slider-runnable-track { height: 8px; border-radius: 4px; background: var(--line); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 32px; height: 32px; margin-top: -12px; border-radius: 50%; background: var(--surface); border: 3.5px solid var(--math); box-shadow: 0 1px 4px rgba(0, 0, 0, .25); }
input[type=range]::-moz-range-track { height: 8px; border-radius: 4px; background: var(--line); }
input[type=range]::-moz-range-thumb { width: 26px; height: 26px; border-radius: 50%; background: var(--surface); border: 3.5px solid var(--math); }
.seg-wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 6px; }
.seg-l { font-weight: 600; font-size: 15px; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.seg-b { min-height: 44px; padding: 0 14px; border: 1.5px solid var(--line-strong); border-radius: 10px; background: var(--surface); color: var(--ink); font: 500 17px var(--mfont); }
.seg-b[aria-checked="true"] { background: var(--math); border-color: var(--math); color: var(--math-ink); }
.ex-info { margin-top: 8px; background: var(--math-bg); border-radius: 12px; padding: 12px 14px; font-size: 16.5px; line-height: 1.55; min-width: 0; overflow-wrap: anywhere; }
.ex-info p { margin: 0 0 6px; }
.ex-info p:last-child { margin-bottom: 0; }
.ex-info .big { font-family: var(--mfont); font-size: 21px; }
.ex-info .target { font-family: var(--mfont); font-size: 20px; color: var(--g-target); }
.forms { display: grid; gap: 8px; margin-bottom: 8px; }
.forms > div { display: grid; gap: 1px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.fl2 { font-size: 12.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--math); }
.forms .m { font-size: 20px; }
.note { font-size: 15px; color: var(--muted); }
.steps { margin: 4px 0 0; padding-left: 1.4em; display: grid; gap: 4px; }
.steps li.todo { color: var(--muted); }
.steps li.now { font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 14px; color: var(--muted); margin-top: 8px !important; }
.lgi { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.lg { display: inline-block; width: 22px; height: 0; border-top: 3px solid; }
.lg-main { border-color: var(--g-main); } .lg-base { border-color: var(--g-base); border-top-style: dashed; } .lg-mid { border-color: var(--g-mid); border-top-style: dashed; }
.lg-line { border-color: var(--g-line); } .lg-alt { border-color: var(--g-alt); } .lg-probe { border-color: var(--g-target); border-top-style: dashed; }
.lg-dist { border-color: var(--g-target); border-top-width: 5px; } .lg-d { border-color: var(--g-d); border-top-style: dashed; } .lg-level { border-color: var(--g-target); border-top-style: dashed; } .lg-hi { border-color: var(--bsp); border-top-width: 6px; }
.t-ok { color: var(--bsp); } .t-no { color: var(--merke); }
.pts { font-variant-numeric: tabular-nums; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { min-height: 44px; padding: 0 18px; border-radius: 10px; border: 1.5px solid var(--line-strong); background: var(--surface); color: var(--ink); font: 600 16px var(--font); }
.tab[aria-selected="true"] { background: var(--math); border-color: var(--math); color: var(--math-ink); }
.tab-pane { display: grid; gap: 14px; }
.obs { border-top: 1px solid var(--line); padding-top: 12px; }
.obs-t { font-weight: 700; color: var(--math); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
.obs-l { margin: 8px 0 0; padding-left: 1.3em; display: grid; gap: 10px; }
.obs-l p { margin: 0; }
.lnk { background: none; border: 0; color: var(--math); font: 600 15px var(--font); padding: 6px 0; text-decoration: underline; text-underline-offset: 3px; min-height: 40px; }
.obs-a { background: var(--bsp-bg); border-radius: 10px; padding: 8px 12px; }

/* SVG */
.plot .grid { stroke: var(--grid); stroke-width: 1; }
.plot .grid2 { stroke: var(--grid2); stroke-width: 1; }
.plot .axis { stroke: var(--axis); stroke-width: 1.6; }
.plot .mk-axis { fill: var(--axis); }
.plot .mk-move { fill: var(--g-mid); }
.plot .tick { fill: var(--muted); font: 500 14px var(--font); }
.plot .axname { fill: var(--ink); font: italic 19px var(--mfont); }
.plot path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.plot path.g-main { stroke: var(--g-main); stroke-width: 3.6; }
.plot path.g-base { stroke: var(--g-base); stroke-width: 2.6; stroke-dasharray: 7 6; }
.plot path.g-mid { stroke: var(--g-mid); stroke-width: 2.2; stroke-dasharray: 4 5; }
.plot path.g-line { stroke: var(--g-line); stroke-width: 3; }
.plot path.g-target { stroke: var(--g-target); stroke-width: 4.5; stroke-dasharray: 11 8; }
.plot path.g-d { stroke: var(--g-d); stroke-width: 2.6; stroke-dasharray: 6 5; }
.plot path.g-alt { stroke: var(--g-alt); stroke-width: 3.6; }
.plot path.g-hi { stroke: var(--bsp); stroke-width: 8; opacity: .45; }
.plot path.ra { stroke: var(--bsp); stroke-width: 1.8; }
.plot .ra-dot { fill: var(--bsp); }
.plot line.aux { stroke: var(--muted); stroke-width: 1.5; }
.plot line.probe { stroke: var(--g-target); stroke-width: 2.2; stroke-dasharray: 7 6; }
.plot line.sym { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 5 6; }
.plot line.asym { stroke: var(--g-alt); stroke-width: 1.8; stroke-dasharray: 8 6; }
.plot line.move { stroke: var(--g-mid); stroke-width: 2; }
.plot line.tri-l { stroke: var(--bsp); stroke-width: 2.6; }
.plot polygon.tri { fill: var(--bsp-bg); stroke: none; }
.plot polygon.fill { fill: var(--math-bg); stroke: none; }
.plot line.hyp { stroke: var(--g-main); stroke-width: 3.6; }
.plot line.dist { stroke: var(--g-target); stroke-width: 4.5; }
.plot line.dist-neg { stroke: var(--merke); stroke-width: 4.5; stroke-dasharray: 5 4; }
.plot line.level { stroke: var(--g-target); stroke-width: 2.6; stroke-dasharray: 9 6; }
.plot line.bar { stroke: var(--bsp); stroke-width: 9; stroke-linecap: round; opacity: .85; }
.plot circle { stroke: var(--surface); stroke-width: 2.5; }
.plot circle.pt-main { fill: var(--g-main); }
.plot circle.pt-base { fill: var(--g-base); }
.plot circle.pt-aux { fill: var(--bsp); }
.plot circle.pt-bad { fill: var(--merke); }
.plot circle.pt-line { fill: var(--g-line); }
.plot circle.pt-probe { fill: var(--g-target); }
.plot circle.ra-dot { stroke: none; }
.plot .lbl { fill: var(--ink); font: 600 16px var(--font); paint-order: stroke; stroke: var(--surface); stroke-width: 5px; stroke-linejoin: round; }
.plot .lbl-tri { fill: var(--bsp); } .plot .lbl-dist { fill: var(--g-target); } .plot .lbl-f { fill: var(--muted); font-family: var(--mfont); font-style: italic; font-size: 19px; }

/* Aufgaben */
.tasks-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 6px; }
.tasks { display: grid; gap: 14px; }
.task { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; display: grid; gap: 12px; min-width: 0; }
.task.is-ok { border-color: var(--bsp); box-shadow: inset 4px 0 0 var(--bsp); }
.task.is-no { border-color: var(--merke); box-shadow: inset 4px 0 0 var(--merke); }
.task-h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.task-nr { font-weight: 700; color: var(--math); }
.pill { font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 999px; }
.pill.done { background: var(--bsp-bg); color: var(--bsp); }
.pill.cas { background: var(--math-bg); color: var(--math); }
.pill.bad { background: var(--merke-bg); color: var(--merke); }
.task-q { font-size: 18px; line-height: 1.62; max-width: 72ch; overflow-wrap: anywhere; }
.task-in { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.fi { display: inline-flex; align-items: center; gap: 8px; }
.fl { font-family: var(--mfont); font-size: 19px; white-space: nowrap; }
.fl.bar { padding: 0 2px; }
.fld { font: 500 19px var(--font); min-height: 50px; width: 7.2em; padding: 0 12px; border: 1.5px solid var(--line-strong); border-radius: 10px; background: var(--surface); color: var(--ink); }
.fld:focus { outline: none; border-color: var(--math); box-shadow: 0 0 0 3px var(--math-bg); }
.fld:disabled { opacity: 1; background: var(--loes-bg); color: var(--ink); -webkit-text-fill-color: var(--ink); }
.fi-term { flex: 1 1 100%; } .fi-term .fld { flex: 1; width: auto; min-width: 0; }
.prev { flex-basis: 100%; font-size: 16px; color: var(--ink); min-height: 1.4em; margin-top: -4px; }
.prev.ph { color: var(--muted); }
.chs { flex-basis: 100%; display: grid; gap: 8px; }
.chs-l { font-weight: 600; }
.chs-o { display: grid; gap: 8px; }
.chs-o.row { grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); max-width: 420px; }
.ch { text-align: left; min-height: 50px; padding: 10px 14px; border: 1.5px solid var(--line-strong); border-radius: 10px; background: var(--surface); color: var(--ink); font: 17px/1.4 var(--font); }
.chs-o.row .ch { text-align: center; }
.ch[aria-checked="true"] { border-color: var(--math); background: var(--math-bg); box-shadow: inset 0 0 0 1.5px var(--math); }
.ch:disabled { cursor: default; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btns.end { justify-content: flex-end; margin-top: 6px; }
.b-pri, .b-sec, .b-warn { min-height: 46px; padding: 0 18px; border-radius: 10px; font: 600 16px var(--font); }
.b-pri { background: var(--math); color: var(--math-ink); border: 1.5px solid var(--math); }
.b-sec { background: var(--surface); color: var(--math); border: 1.5px solid var(--line-strong); }
.b-warn { background: var(--merke); color: var(--surface); border: 1.5px solid var(--merke); }
.big { min-height: 52px; padding: 0 24px; font-size: 17px; }
.fb { padding: 10px 14px; border-radius: 10px; font-weight: 500; }
.fb.ok { background: var(--bsp-bg); color: var(--bsp); }
.fb.no { background: var(--merke-bg); color: var(--merke); }
.fb.hint-fb { background: var(--warn-bg); color: var(--ink); }
.fb .muted { font-weight: 400; }
.hint { background: var(--warn-bg); padding: 10px 14px; border-radius: 10px; }
.sol { background: var(--loes-bg); padding: 12px 16px; border-radius: 10px; border-left: 4px solid var(--loes); line-height: 1.75; overflow-wrap: anywhere; }
.lab { display: block; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 2px; }
.hint .lab { color: var(--warn); } .sol .lab { color: var(--loes); }
.st-nav { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 8px; }

/* Startseite */
.hero { display: grid; gap: 10px; justify-items: start; margin: 8px 0 22px; }
.hero h1 { font-size: 40px; }
.how-l { margin: 0; padding-left: 1.3em; display: grid; gap: 6px; }
.how p { margin: 0; }
.st-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; margin: 18px 0; }

.kp { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--surface); border-top: 1px solid var(--line-strong); box-shadow: 0 -6px 20px rgba(0, 0, 0, .14); padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); padding-top: 8px; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); }
.kp-in { max-width: 860px; margin: 0 auto; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; }

.kp .k:active { filter: brightness(.92); }

  return okFn(x => A * x * x + B * x + C) && (A === 0 || okFn(x => x * x + (B / A) * x + C / A));
}
/* zwei Funktionen in derselben Aufgabe: Auch ihre Differenz (in beiden Richtungen) darf nicht gesperrt sein;
   ist die Differenz eine Parabel (z. B. bei x³ und (x − c)³ + d), gilt zusätzlich okEq */
function okPair(f, g) {
  const d = x => f(x) - g(x);
  if (!okFn(d) || !okFn(x => -d(x))) return false;
  const v0 = d(0), v1 = d(1), vm = d(-1);
  if (![v0, v1, vm].every(Number.isFinite)) return true;
  const A = (v1 + vm) / 2 - v0, B = (v1 - vm) / 2;
  const quad = Math.abs(A) > 1e-12 && [2, 3, -2.5, 4.5, -3.5].every(x => { const u = d(x); return Number.isFinite(u) && Math.abs(u - (A * x * x + B * x + v0)) < 1e-9 * Math.max(1, Math.abs(u)); });
  return !quad || okEq(A, B, v0);
}

T.fb_stellen = () => {

T.qf_fakt = () => {
  let a, d, k, e;
  do { a = pick([1, -1, 2, -2, 0.5]); d = R(-4, 4); k = pick([1, 2, 3]); e = -a * k * k; } while (!okEq(a, -2 * a * d, a * d * d + e));
  const steps = [`${vform(a, d, e)} = 0`, `${pre(a)}${sq(d)} = ${N(-e)}`];
  if (a !== 1) steps.push(`${sq(d)} = ${N(k * k)}`);
  steps.push(`${linNoPar(d)} = ${N(-k)} oder ${linNoPar(d)} = ${N(k)}`);
  steps.push(`x = ${N(d - k)} oder x = ${N(d + k)}`);
  return {
    q: `Gegeben ist f(x) = ${vform(a, d, e)}. Bestimmen Sie die faktorisierte Form f(x) = a(x − x₁)(x − x₂). Geben Sie a, x₁ und x₂ an.`,
    inputs: [{ type: "num", label: "a =" }, { type: "num", label: "x₁ =" }, { type: "num", label: "x₂ =" }],
    check: v => {
      const r = nums(v, 3); if (r.err) return r.err; const [ua, u1, u2] = r.u;
      const roots = samePair(u1, u2, d - k, d + k);
      if (close(ua, a) && roots) return OK(`Richtig! f(x) = ${fform(a, d - k, d + k)}`);
      if (roots) return NO("Die Nullstellen stimmen. Der Faktor a vor der Klammer bleibt in allen drei Formen gleich.");
      if (close(ua, a)) return NO("a stimmt. Bestimme jetzt die Nullstellen: f(x) = 0 lösen.");
      return NO();
    },
    hint: "Setze f(x) = 0, löse nach (x − d)² auf und ziehe die Wurzel (zwei Lösungen). Der Faktor a bleibt gleich.",
    sol: `${steps.join(" ⇔ ")}<br><b>f(x) = ${fform(a, d - k, d + k)}</b> mit a = ${N(a)}; x₁ = ${N(d - k)}; x₂ = ${N(d + k)}`,
    answer: [String(a), String(d - k), String(d + k)]
  };
};
T.qf_ausSP = () => {
  let a, d, e, h;
  do { a = pick([-2, -1, -0.5, 0.5, 1, 2, 3]); d = R(-4, 4); e = R(-5, 5); h = pick([1, 2, -1, -2]); } while (!okEq(a, -2 * a * d, a * d * d + e) || Math.abs(e + a * h * h) > 12);
  const px = d + h, py = e + a * h * h;
  return {
    q: `Eine Parabel hat den Scheitelpunkt S(${N(d)} | ${N(e)}) und verläuft durch den Punkt P(${N(px)} | ${N(py)}). Bestimmen Sie den Faktor a der Scheitelpunktform f(x) = a(x − d)² + e.`,
    inputs: [{ type: "num", label: "a =" }],
    check: v => {
      const r = nums(v, 1); if (r.err) return r.err; const u = r.u[0];
      if (close(u, a)) return OK(`Richtig! f(x) = ${vform(a, d, e)}`);
      if (Math.abs(h) !== 1 && close(u, (py - e) / h)) return NO(`Teile durch (x − d)², nicht durch (x − d): (${N(px)} ${MINUS} ${P(d)})${expo(2)} = ${N(h * h)}.`);
      if (close(u, (py + e) / (h * h))) return NO("Prüfe das Vorzeichen von e beim Umstellen.");
      return NO();
    },
    hint: "Setze d und e in die Scheitelpunktform ein, dann die Koordinaten von P. Löse nach a auf.",
    sol: `f(x) = a${sq(d)}${tail(e)}; P einsetzen: ${N(py)} = a·(${N(px)} ${MINUS} ${P(d)})${expo(2)}${tail(e)} = a·${N(h * h)}${tail(e)} ⇔ a·${N(h * h)} = ${N(py - e)} ⇔ <b>a = ${N(a)}</b><br>f(x) = ${vform(a, d, e)}`,
    answer: [String(a)]
  };
};

/* ----- Station 4: Nullstellen und pq-Formel ----- */
T.ns_pq = () => {
  let a, r1, r2, B, C;
  do { a = pick([1, 1, 2, -1, -2, 3]); r1 = R(-6, 5); r2 = R(r1 + 1, 6); B = -a * (r1 + r2); C = a * r1 * r2; } while (!okEq(a, B, C));
  const p = -(r1 + r2), q = r1 * r2, D = (p / 2) ** 2 - q;
  const norm = a === 1 ? "" : `${poly([[a, 2], [B, 1], [C, 0]])} = 0 &nbsp;| : ${P(a)}<br>`;
  return {
    q: `Berechnen Sie die Nullstellen der Funktion f mit f(x) = ${poly([[a, 2], [B, 1], [C, 0]])}.`,
    inputs: [{ type: "num", label: "x₁ =" }, { type: "num", label: "x₂ =" }],
    check: v => {
      const r = nums(v, 2); if (r.err) return NO("Gib beide Nullstellen ein. Die Reihenfolge ist egal.");
      const [u1, u2] = r.u;
      if (samePair(u1, u2, r1, r2)) return OK(`Richtig! x₁ = ${N(r1)}; x₂ = ${N(r2)}`);
      if (samePair(u1, u2, -r1, -r2)) return NO("Prüfe die Vorzeichen: x = −p/2 ± √((p/2)² − q).");
      if (a !== 1) return NO(`Hast du zuerst durch ${N(a)} geteilt? Die pq-Formel gilt nur für x² + px + q = 0.`);
      return NO();
    },
    hint: a === 1 ? "pq-Formel: x² + px + q = 0 ⇒ x = −p/2 ± √((p/2)² − q)." : `Teile zuerst durch ${N(a)}, damit vor x² eine 1 steht. Dann pq-Formel.`,
    sol: `${norm}${poly([[1, 2], [p, 1], [q, 0]])} = 0 &nbsp;(p = ${N(p)}; q = ${N(q)})<br>x = ${N(-p / 2)} ± √(${P(p / 2)}${expo(2)} ${MINUS} ${P(q)}) = ${N(-p / 2)} ± √${N(D)} = ${N(-p / 2)} ± ${N(Math.sqrt(D))}<br><b>x₁ = ${N(r1)}; x₂ = ${N(r2)}</b><br>Auch richtig: quadratische Ergänzung statt pq-Formel. Probe: f(${N(r1)}) = 0; f(${N(r2)}) = 0.`,
    answer: [String(r1), String(r2)]
  };
};
T.ns_anzahl = () => {
  let a, p, D, q, B, C;
  do { a = pick([1, 1, 2, -1, 3, 0.5]); p = pick([-6, -4, -2, 2, 4, 6]); D = R(-3, 4); q = (p / 2) ** 2 - D; B = a * p; C = a * q; } while (!okEq(a, B, C));
  const count = D > 0 ? 2 : D === 0 ? 1 : 0;
  const word = ["keine Lösung", "genau eine Lösung", "zwei Lösungen"][count];
  return {
    q: `Gegeben ist die Gleichung ${poly([[a, 2], [B, 1], [C, 0]])} = 0. Bestimmen Sie den Term D = (p/2)² − q unter der Wurzel der pq-Formel und die Anzahl der Lösungen.`,
    inputs: [{ type: "num", label: "D =" }, { type: "choice", label: "Anzahl der Lösungen", opts: ["0", "1", "2"] }],
    check: v => {
      const uD = parseNum(v[0]), i = idx(v[1]);
      if (!Number.isFinite(uD) || i < 0) return NO(EMPTY);
      if (close(uD, D) && i === count) return OK(`Richtig! D = ${N(D)}, also ${word}.`);
      if (a !== 1 && close(uD, (B / 2) ** 2 - C) && !close(uD, D)) return NO(`Erst normieren: durch ${N(a)} teilen, dann p und q ablesen.`);
      if (close(uD, D)) return NO("D stimmt. D > 0: zwei Lösungen, D = 0: eine Lösung, D < 0: keine Lösung.");
      if (close(uD, (p / 2) ** 2 + q)) return NO("D = (p/2)² − q: q wird abgezogen.");
      return NO();
    },
    hint: "Normiere zuerst (durch den Faktor vor x² teilen). Dann D = (p/2)² − q berechnen: D > 0 zwei, D = 0 eine, D < 0 keine Lösung.",
    sol: `${a !== 1 ? `| : ${P(a)} &nbsp;⇒ ` : ""}${poly([[1, 2], [p, 1], [q, 0]])} = 0; p = ${N(p)}; q = ${N(q)}<br>D = (${N(p / 2)})${expo(2)} ${MINUS} ${P(q)} = <b>${N(D)}</b> ⇒ <b>${word}</b>`,
    answer: [String(D), String(count)]
  };
};
T.ns_ohnePQ = () => {
  const type = rnd() < 0.5 ? 1 : 2;
  let a, r, b, c;
  if (type === 1) { do { a = pick([1, 2, -1, 3, -2, 0.5]); r = Rnz(-6, 6); b = -a * r; } while (!okEq(a, b, 0)); }
  else { do { a = pick([1, 2, -1, 0.5, 3]); r = R(1, 5); c = -a * r * r; } while (!okEq(a, 0, c)); }
  const roots = type === 1 ? [0, r] : [-r, r];
  const eq = type === 1 ? poly([[a, 2], [b, 1]]) : poly([[a, 2], [c, 0]]);
  let sol;
  if (type === 1) sol = `${eq} = 0 ⇔ x·(${poly([[a, 1], [b, 0]])}) = 0 ⇔ x = 0 oder ${poly([[a, 1], [b, 0]])} = 0 ⇔ <b>x = 0 oder x = ${N(r)}</b> (Satz vom Nullprodukt)`;
  else { const st = [`${eq} = 0`, `${pw(a, 2)} = ${N(-c)}`]; if (a !== 1) st.push(`x${expo(2)} = ${N(r * r)}`); st.push(`<b>x = ${N(-r)} oder x = ${N(r)}</b>`); sol = st.join(" ⇔ "); }
  return {
    q: `Bestimmen Sie die Lösungen der Gleichung ${eq} = 0 ohne pq-Formel.`,
    inputs: [{ type: "num", label: "x₁ =" }, { type: "num", label: "x₂ =" }],
    check: v => {
      const u1 = parseNum(v[0]), u2 = parseNum(v[1]);
      if (samePair(u1, u2, roots[0], roots[1])) return OK();
      const one = (close(u1, r) || close(u2, r) || close(u1, -r) || close(u2, -r));
      if (type === 1 && one && !(close(u1, 0) || close(u2, 0))) return NO("Klammere x aus, statt durch x zu teilen. Beim Teilen durch x geht die Lösung x = 0 verloren.");
      if (type === 2 && one) return NO("Denke an beide Vorzeichen: x² = k hat für k > 0 zwei Lösungen.");
      if (!Number.isFinite(u1) || !Number.isFinite(u2)) return NO("Es gibt zwei Lösungen. Fülle beide Felder aus.");
      return NO();
    },
    hint: type === 1 ? "Klammere x aus: x·(…) = 0. Ein Produkt ist null, wenn ein Faktor null ist." : "Stelle nach x² um und ziehe die Wurzel. Denke an beide Vorzeichen.",
    sol,
    answer: roots.map(String)
  };
};
const FEHLERARTEN = ["Die Gleichung wurde nicht durch den Faktor vor x² geteilt (nicht normiert).", "Das Vorzeichen bei −p/2 ist falsch.", "Das ± wurde vergessen, eine Lösung fehlt.", "Unter der Wurzel wurde q addiert statt subtrahiert."];
T.ns_fehler = () => {
  let a, r1, r2, B, C, err;
  do { a = pick([2, 3, -2, -1, 0.5]); r1 = R(-4, 3); r2 = R(r1 + 1, 5); B = -a * (r1 + r2); C = a * r1 * r2; err = R(0, 3); }
  while (!okEq(a, B, C) || r1 + r2 === 0 || (err === 3 && r1 * r2 === 0) || (err === 0 && (B / 2) ** 2 - C < 0) || (a === 2 && r1 === 1 && r2 === 3));
  const p = -(r1 + r2), q = r1 * r2, D = (p / 2) ** 2 - q, w = Math.sqrt(D);
  const eq = `${poly([[a, 2], [B, 1], [C, 0]])} = 0`, norm = `${poly([[1, 2], [p, 1], [q, 0]])} = 0`;
  let calc;
  if (err === 0) { const D0 = (B / 2) ** 2 - C; calc = `${eq}; p = ${N(B)}; q = ${N(C)}<br>x = ${N(-B / 2)} ± √(${P(B / 2)}${expo(2)} ${MINUS} ${P(C)}) = ${N(-B / 2)} ± √${N(D0)}`; }
  else if (err === 1) calc = `${eq} &nbsp;| : ${P(a)} ⇒ ${norm}<br>x = ${N(p / 2)} ± √(${P(p / 2)}${expo(2)} ${MINUS} ${P(q)}) = ${N(p / 2)} ± ${N(w)}<br>x₁ = ${N(p / 2 - w)}; x₂ = ${N(p / 2 + w)}`;
  else if (err === 2) calc = `${eq} &nbsp;| : ${P(a)} ⇒ ${norm}<br>x = ${N(-p / 2)} + √(${P(p / 2)}${expo(2)} ${MINUS} ${P(q)}) = ${N(-p / 2)} + ${N(w)} = ${N(r2)}<br>Die Gleichung hat nur die Lösung x = ${N(r2)}.`;
  else { const D3 = (p / 2) ** 2 + q; calc = `${eq} &nbsp;| : ${P(a)} ⇒ ${norm}<br>x = ${N(-p / 2)} ± √(${P(p / 2)}${expo(2)} + ${P(q)}) = ${N(-p / 2)} ± √${D3 < 0 ? "(" + N(D3) + ")" : N(D3)}${D3 < 0 ? "<br>Die Gleichung hat keine Lösung." : ""}`; }
  return {
    q: `Beim Lösen der Gleichung ${eq} ist ein Fehler passiert:<span class="rechnung">${calc}</span>Bestimmen Sie die Art des Fehlers und geben Sie die richtigen Lösungen an.`,
    inputs: [{ type: "choice", label: "Art des Fehlers", opts: FEHLERARTEN }, { type: "num", label: "x₁ =" }, { type: "num", label: "x₂ =" }],
    check: v => {
      const i = idx(v[0]), u1 = parseNum(v[1]), u2 = parseNum(v[2]);
      if (i < 0 || !Number.isFinite(u1) || !Number.isFinite(u2)) return NO(EMPTY);
      const okR = samePair(u1, u2, r1, r2);
      if (i === err && okR) return OK();
      if (i !== err) return NO("Die Art des Fehlers stimmt noch nicht. Vergleiche Schritt für Schritt mit der pq-Formel.");
      return NO("Die Art des Fehlers stimmt. Rechne jetzt richtig: normieren, dann pq-Formel.");
    },
    hint: "Prüfe der Reihe nach: Wurde normiert? Stimmt −p/2? Steht unter der Wurzel (p/2)² − q? Gibt es ±?",
    sol: `Fehler: <b>${FEHLERARTEN[err]}</b><br>Richtig: ${eq} &nbsp;| : ${P(a)} ⇒ ${norm}<br>x = ${N(-p / 2)} ± √(${P(p / 2)}${expo(2)} ${MINUS} ${P(q)}) = ${N(-p / 2)} ± ${N(w)} ⇒ <b>x₁ = ${N(r1)}; x₂ = ${N(r2)}</b>`,
    answer: [String(err), String(r1), String(r2)]
  };
};

/* ----- Station 5: Potenzfunktionen ----- */
function powPair(ns, as) { let a, n; do { a = pick(as); n = pick(ns); } while (!okFn(x => a * x ** n)); return [a, n]; }
const powShow = (a, n) => (n > 0 ? pw(a, n) : `${pw(a, n)} = ${recip(a, n)}`);
const VERLAUF = ["von links oben nach rechts oben", "von links unten nach rechts oben", "von links oben nach rechts unten", "von links unten nach rechts unten"];
T.po_symdef = () => {
  const [a, n] = powPair([-4, -3, -2, -1, 2, 3, 4, 5, 6], [-3, -2, -0.5, 0.5, 2, 3, 4]);
  const Dr = n > 0 ? 0 : 1, Sr = n % 2 === 0 ? 0 : 1;
  const DO = ["D = ℝ", "D = ℝ\\{0}"], SO = ["achsensymmetrisch zur y-Achse", "punktsymmetrisch zum Ursprung"];
  return {
    q: `Gegeben ist f(x) = ${powShow(a, n)}. Geben Sie die maximale Definitionsmenge und die Symmetrie des Graphen an.`,
    inputs: [{ type: "choice", label: "Definitionsmenge", opts: DO }, { type: "choice", label: "Symmetrie", opts: SO }],
    check: v => {
      const i = idx(v[0]), j = idx(v[1]); if (i < 0 || j < 0) return NO("Wähle in beiden Zeilen eine Antwort aus.");
      if (i === Dr && j === Sr) return OK();
      if (i !== Dr) return NO(n < 0 ? "Bei negativem Exponenten steht x im Nenner: x = 0 ist ausgeschlossen." : "Bei positivem Exponenten darf man jede Zahl einsetzen.");
      return NO("Die Symmetrie hängt nur davon ab, ob der Exponent gerade oder ungerade ist, nicht vom Vorzeichen von a.");
    },
    hint: "Gerader Exponent: achsensymmetrisch zur y-Achse. Ungerader Exponent: punktsymmetrisch zum Ursprung. Negativer Exponent: x im Nenner, also x ≠ 0.",
    sol: `<b>${DO[Dr]}</b>${n < 0 ? " (x steht im Nenner)" : ""}; <b>${SO[Sr]}</b>, weil der Exponent ${N(n)} ${n % 2 === 0 ? "gerade" : "ungerade"} ist: f(${MINUS}x) = ${n % 2 === 0 ? "f(x)" : MINUS + "f(x)"}.`,
    answer: [String(Dr), String(Sr)]
  };
};
T.po_verlauf = () => {

  return {
    q: `Beschreiben Sie den Verlauf des Graphen von f(x) = ${pw(a, n)} für x → ${MINUS}∞ und x → +∞.`,

      if (n % 2 === 1 && (i === 0 || i === 3)) return NO("Bei ungeradem Exponenten zeigen die Enden in entgegengesetzte Richtungen.");
      return NO("Das Vorzeichen von a entscheidet: a < 0 spiegelt den Graphen an der x-Achse.");
    },

    sol: `Exponent ${n} ${n % 2 === 0 ? "gerade" : "ungerade"}; a = ${N(a)} ${a > 0 ? ">" : "<"} 0. Der Graph verläuft <b>${VERLAUF[id]}</b>.`,

  };
};
T.po_wert = () => {

      if (close(u, k * n) || close(u, k)) return NO(`Berechne f(${N(k)}x) = (${N(k)}x)${expo(n)} und vergleiche mit f(x).`);

/* ----- Station 6: Verschieben ----- */
const BASEKEYS = ["x2", "x3", "x4", "r1", "r2"];
function shiftDescr(c, d) {
  const parts = [];
  if (c !== 0) parts.push(`um ${N(Math.abs(c))} nach ${c > 0 ? "rechts" : "links"}`);
  if (d !== 0) parts.push(`um ${N(Math.abs(d))} nach ${d > 0 ? "oben" : "unten"}`);
  return parts.join(" und ");
}
function trafoPick(bases, as) {
  let base, a, c, d;
  do { base = pick(bases); a = pick(as); c = Rnz(-4, 4); d = Rnz(-4, 4); } while (!okFn(tfun(base, a, 1, c, d)) || (base === "x2" && !okEq(a, -2 * a * c, a * c * c + d)) || !okPair(BASES[base].f, tfun(base, a, 1, c, d)));
  return [base, a, c, d];
}

/* ----- Station 7: Strecken und Spiegeln ----- */

  }

  return {

    hint: "a·f(x): y-Richtung, Faktor |a|. f(b·x): x-Richtung, Faktor 1/|b|. Negative Faktoren spiegeln.",

    answer: [String(opts.findIndex(o => o.c))]

};

/* ----- Station 8: Transformationen verbinden ----- */
function chainSteps(a, c, d) {
  const steps = [];
  if (a < 0) steps.push("an der x-Achse gespiegelt");
  if (Math.abs(a) !== 1) steps.push(`mit dem Faktor ${N(Math.abs(a))} in y-Richtung gestreckt`);
  steps.push(shiftDescr(c, d) + " verschoben");
  return steps;
}
T.tr_term = () => {
  const [base, a, c, d] = trafoPick(BASEKEYS, [-3, -2, -1, -0.5, 0.5, 2, 3]);
  const st = chainSteps(a, c, d);
  return {
    q: `Der Graph von f mit f(x) = ${BASES[base].html} wird nacheinander ${st.join(", dann ")}. Geben Sie den Funktionsterm g(x) des neuen Graphen an (ohne das Funktionszeichen f).`,
    inputs: [{ type: "term", label: "g(x) =" }],
    check: v => {
      if (!String(v[0] || "").trim()) return NO(EMPTY);
      const r = sameFn(v[0], tfun(base, a, 1, c, d)); if (r.ok) return OK(`Richtig! g(x) = ${tterm(base, a, 1, c, d)}`);
      if (r.err === "lesen") return NO("Den Term konnte ich nicht lesen. Nutze x, ^ für Exponenten und Klammern.");
      if (r.err === "pruefbar") return NO(PRUEFMSG);
      if (r.err === "definition") return NO(DEFMSG);
      if (sameFn(v[0], tfun(base, a, 1, -c, d)).ok) return NO("Vorzeichenfalle in der Klammer: nach rechts um c heißt (x − c).");
      if (sameFn(v[0], tfun(base, a, 1, c, a * d)).ok) return NO("Reihenfolge: Die Verschiebung nach oben oder unten kommt nach dem Strecken. Sie wird nicht mitgestreckt.");
      if (sameFn(v[0], tfun(base, -a, 1, c, d)).ok) return NO(a < 0 ? "Prüfe das Vorzeichen von a: Spiegelung an der x-Achse heißt negativer Faktor." : "Prüfe das Vorzeichen von a: Hier wird nicht an der x-Achse gespiegelt, der Faktor ist positiv.");
      return termFail(v[0]) || NO();
    },
    hint: "Erst a·f(x) bilden (strecken, spiegeln), dann x durch (x − c) ersetzen und am Ende d addieren: g(x) = a·f(x − c) + d.",
    sol: `g(x) = ${N(a)}·f(${linNoPar(c)})${tail(d)} = <b>${tterm(base, a, 1, c, d)}</b>`,
    answer: [termPlain(base, a, 1, c, d)]
  };
};

const AUSSAGEN = [
  () => { let c, d; do { c = pick([2, 3, 4]); d = pick([1, 2, 5]); } while (!okEq(1, 2 * c, c * c - d) || !okEq(1, -2 * c, c * c - d) || !okPair(x => x * x, x => (x + c) ** 2 - d) || !okPair(x => x * x, x => (x - c) ** 2 - d)); return { claim: `Der Graph von g mit g(x) = (x + ${c})${expo(2)} ${MINUS} ${d} entsteht aus dem Graphen von f mit f(x) = x${expo(2)} durch Verschiebung um ${c} nach rechts und um ${d} nach unten.`, ok: false, right: `Verschiebung um ${c} nach links und um ${d} nach unten`, typ: "Das Vorzeichen in der Klammer wurde falsch gedeutet: x + c bedeutet eine Verschiebung nach links." }; },
  () => { let a, d; do { a = pick([2, 3]); d = pick([1, 2, 4]); } while (!okEq(a, 0, d) || !okEq(a, 0, a * d) || !okEq(1, 0, d) || !okPair(x => x * x, x => a * x * x + d) || !okPair(x => x * x, x => a * (x * x + d))); return { claim: `Man verschiebt den Graphen von f mit f(x) = x${expo(2)} um ${d} nach oben und streckt ihn danach mit dem Faktor ${a} in y-Richtung. Das ergibt g(x) = ${a}x${expo(2)} + ${d}.`, ok: false, right: `g(x) = ${a}(x${expo(2)} + ${d}) = ${a}x${expo(2)} + ${a * d}`, typ: "Bei dieser Reihenfolge wird die Verschiebung mitgestreckt." }; },
  () => { const b = pick([2, 3]); return { claim: `Der Graph von g mit g(x) = f(${b}x) entsteht aus dem Graphen von f durch Streckung mit dem Faktor ${b} in x-Richtung.`, ok: false, right: `Streckung mit dem Faktor ${fracOf(1 / b)} in x-Richtung`, typ: "Ein Faktor b im Argument wirkt mit 1/b auf die x-Werte." }; },
  () => { const d = pick([2, 3]); return { claim: `Der Graph von g mit g(x) = ${MINUS}x${expo(3)} + ${d} entsteht aus dem Graphen von f mit f(x) = x${expo(3)} durch Spiegelung an der x-Achse und anschließende Verschiebung um ${d} nach oben.`, ok: true }; },
  () => { const c = pick([1, 2, 3]); return { claim: `Der Graph von g mit g(x) = ${fr(1, "x " + MINUS + " " + c)} hat die senkrechte Asymptote x = ${c}.`, ok: true }; },
  () => { const u = pick([4, 6, 8]); return { claim: `Liegt P(${u} | 1) auf dem Graphen von f, dann liegt P′(${2 * u} | 1) auf dem Graphen von g mit g(x) = f(2x).`, ok: false, right: `P′(${u / 2} | 1), denn g(${u / 2}) = f(2·${u / 2}) = f(${u}) = 1`, typ: "Bei f(b·x) wird die x-Koordinate durch b geteilt, nicht mit b multipliziert." }; },
  () => ({ claim: `Der Graph von g mit g(x) = ${MINUS}f(x) entsteht aus dem Graphen von f durch Spiegelung an der y-Achse.`, ok: false, right: `Spiegelung an der x-Achse; an der y-Achse spiegelt g(x) = f(${MINUS}x)`, typ: "Ein Minus vor f(x) ändert die y-Werte, also wird an der x-Achse gespiegelt." })
];
T.tr_fehler = () => {
  const F = pick(AUSSAGEN)();
  return {
    q: `Beurteilen Sie die Aussage. <span class="quote">${F.claim}</span>`,
    inputs: [{ type: "choice", label: "", opts: ["Die Aussage ist richtig.", "Die Aussage ist falsch."] }],
    check: v => { const i = idx(v[0]); if (i < 0) return NO(PICK); return (i === 0) === F.ok ? OK(F.ok ? "Richtig, die Aussage stimmt." : `Richtig, die Aussage ist falsch. Richtig wäre: ${F.right}.`) : NO("Prüfe mit einem markanten Punkt, wohin er wandert."); },
    hint: "Prüfe mit einem markanten Punkt, zum Beispiel dem Scheitelpunkt oder dem Punkt (1 | 1), wohin er wandert.",

/* ----- Station 9: Abstand und Bereiche ----- */
T.gv_abstand = () => {
  let h, k, m, n, f, g, x0, ok;
  do {
    h = R(-1, 3); k = R(4, 8); m = pick([-1, 0.5, 1, 2]); n = R(-3, 1);
    f = x => -((x - h) ** 2) + k; g = x => m * x + n;
    const cand = []; for (let x = -2; x <= 5; x++) if (f(x) - g(x) > 0) cand.push(x);
    ok = cand.length > 0 && okEq(-1, 2 * h, k - h * h) && okFn(g) && okEq(-1, 2 * h - m, k - h * h - n);
    if (ok) x0 = pick(cand);
  } while (!ok);
  const dv = f(x0) - g(x0);
  return {
    q: `Gegeben sind f(x) = ${vform(-1, h, k)} und g(x) = ${poly([[m, 1], [n, 0]])}. An der Stelle x = ${N(x0)} liegt der Graph von f oberhalb des Graphen von g. Berechnen Sie den vertikalen Abstand der Graphen an dieser Stelle.`,
    inputs: [{ type: "num", label: "d =" }],
    check: v => { const r = nums(v, 1); if (r.err) return r.err; const u = r.u[0]; if (close(u, dv)) return OK(); if (close(u, -dv)) return NO("Ein Abstand ist positiv: oberer minus unterer Funktionswert."); return NO(); },
    hint: "Vertikaler Abstand an derselben Stelle: d = f(x) − g(x), oberer minus unterer Funktionswert.",
    sol: `f(${N(x0)}) = ${N(f(x0))}; g(${N(x0)}) = ${N(g(x0))}; d = ${N(f(x0))} ${MINUS} ${P(g(x0))} = <b>${N(dv)}</b>`,
    answer: [String(dv)]
  };
};
T.gv_maxabst = () => {

T.gv_bereich = () => {

/* ----- Station 10: Gemeinsame Punkte und Strecken ----- */
T.gp_param = () => {
  const variant = rnd() < 0.5;
  let d, e, m, B, C, tStar, tTest;
  do {
    if (variant) { d = Rnz(-4, 4); e = R(-5, 5); B = -2 * d; C = d * d + e; m = 0; tStar = e; }
    else { m = pick([-2, -1, 3]); d = Rnz(-3, 3); B = -2 * d + m; C = R(-4, 6); tStar = C - d * d; }
    tTest = tStar + pick([-3, -2, 2, 3]);
  } while (!okEq(1, B, C) || (variant && d === -1 && e === 1) || !okEq(1, B - m, C - tStar) || !okEq(1, B - m, C - tTest) || !okFn(x => m * x + tStar) || !okFn(x => m * x + tTest));
  const count = tTest > tStar ? 2 : 0;
  const lineT = m === 0 ? "t" : `${poly([[m, 1]])} + t`;
  const kq = d * d - C;
  return {
    q: `Gegeben sind p(x) = ${poly([[1, 2], [B, 1], [C, 0]])} und h<sub>t</sub>(x) = ${lineT}. Bestimmen Sie den Wert von t, für den die Graphen genau einen gemeinsamen Punkt haben, und die Anzahl der gemeinsamen Punkte für t = ${N(tTest)}.`,
    inputs: [{ type: "num", label: "genau ein Punkt für t =" }, { type: "choice", label: `Anzahl für t = ${N(tTest)}`, opts: ["0", "1", "2"] }],
    check: v => {
      const ut = parseNum(v[0]), i = idx(v[1]); if (!Number.isFinite(ut) || i < 0) return NO(EMPTY);
      if (close(ut, tStar) && i === count) return OK();
      if (!close(ut, tStar)) return NO("Gleichsetzen, auf x² + px + q = 0 bringen und D = (p/2)² − q berechnen. Genau ein gemeinsamer Punkt bei D = 0.");
      return NO(`Setze t = ${N(tTest)} in D ein: D > 0 zwei, D = 0 ein, D < 0 kein gemeinsamer Punkt.`);
    },
    hint: "p(x) = hₜ(x) gleichsetzen, alles auf eine Seite: x² + px + q = 0, dabei hängt q von t ab. D = (p/2)² − q entscheidet.",
    sol: `${poly([[1, 2], [B, 1], [C, 0]])} = ${lineT} ⇔ ${poly([[1, 2], [B - m, 1], [C, 0]])} ${MINUS} t = 0<br>D = (${N((B - m) / 2)})${expo(2)} ${MINUS} (${N(C)} ${MINUS} t) = t${tail(kq)}<br>D = 0 ⇔ <b>t = ${N(tStar)}</b>. Für t = ${N(tTest)} ist D = ${N(tTest + kq)} ${tTest > tStar ? "> 0: <b>zwei gemeinsame Punkte</b>" : "< 0: <b>kein gemeinsamer Punkt</b>"}.`,
    answer: [String(tStar), String(count)]
  };
};
function schnittPick(ms, lenOk) {
  let a, r1, r2, m, n, B, C, f, g;
  do {
    a = pick([1, -1, 0.5, 2]); r1 = R(-4, 2); r2 = R(r1 + 1, 4); m = pick(ms); n = R(-4, 4);
    B = -a * (r1 + r2) + m; C = a * r1 * r2 + n; f = x => a * x * x + B * x + C; g = x => m * x + n;
  } while (!okEq(a, B, C) || !okFn(g) || !okEq(a, B - m, C - n) || (lenOk && !lenOk(r1, r2, m)) || Math.abs(g(r1)) > 9 || Math.abs(g(r2)) > 9);
  return { a, r1, r2, m, n, B, C, f, g };
}
function schnittRechnung(s) {
  const { a, r1, r2, m, n, B, C } = s, p = -(r1 + r2), q = r1 * r2, D = (p / 2) ** 2 - q;
  const eq = `${poly([[a, 2], [B - m, 1], [C - n, 0]])} = 0`;
  return `${poly([[a, 2], [B, 1], [C, 0]])} = ${poly([[m, 1], [n, 0]])} ⇔ ${eq}${a !== 1 ? ` &nbsp;| : ${P(a)} ⇒ ${poly([[1, 2], [p, 1], [q, 0]])} = 0` : ""}<br>x = ${N(-p / 2)} ± √${N(D)} = ${N(-p / 2)} ± ${N(Math.sqrt(D))}, also x₁ = ${N(r1)}; x₂ = ${N(r2)}`;
}
T.gp_schnitt = () => {
  const s = schnittPick([-2, -1, 1, 2, 0.5, 3]);
  const { r1, r2, m, n, B, C, a } = s, y1 = s.g(r1), y2 = s.g(r2);
  return {
    q: `Berechnen Sie die Schnittpunkte der Graphen von f(x) = ${poly([[a, 2], [B, 1], [C, 0]])} und g(x) = ${poly([[m, 1], [n, 0]])}.`,
    inputs: [{ type: "pt", label: "S₁" }, { type: "pt", label: "S₂" }],
    check: v => {
      const r = nums(v, 4); if (r.err) return r.err; const [a1, b1, a2, b2] = r.u;
      const pOk = (x, y, X, Y) => close(x, X) && close(y, Y);
      if ((pOk(a1, b1, r1, y1) && pOk(a2, b2, r2, y2)) || (pOk(a1, b1, r2, y2) && pOk(a2, b2, r1, y1))) return OK();
      if (samePair(a1, a2, r1, r2)) return NO("Die x-Koordinaten stimmen. Setze sie in g(x) ein, um die y-Koordinaten zu erhalten.");
      return NO();
    },
    hint: "Gleichsetzen: f(x) = g(x). Alles auf eine Seite, normieren, pq-Formel. Danach die y-Koordinaten mit g berechnen.",
    sol: `${schnittRechnung(s)}<br>y-Koordinaten: g(${N(r1)}) = ${N(y1)}; g(${N(r2)}) = ${N(y2)}<br><b>S₁(${N(r1)} | ${N(y1)}); S₂(${N(r2)} | ${N(y2)})</b>`,
    answer: [String(r1), String(y1), String(r2), String(y2)]
  };
};
const TRIPEL = [[3, 4, 5], [4, 3, 5], [6, 8, 10], [8, 6, 10], [5, 12, 13], [12, 5, 13], [6, 2.5, 6.5]];
T.gp_strecke = () => {
  const trip = pick(TRIPEL);
  let xa, ya, xb, yb;
  do { xa = R(-5, 2); ya = R(-4, 3); xb = xa + pick([1, -1]) * trip[0]; yb = ya + pick([1, -1]) * trip[1]; } while (xa === -1 && ya === 2 && xb === 3 && yb === 5);
  return {
    q: `Berechnen Sie die Länge der Strecke AB mit A(${N(xa)} | ${N(ya)}) und B(${N(xb)} | ${N(yb)}).`,
    inputs: [{ type: "num", label: "|AB| =" }],
    check: v => { const r = nums(v, 1); if (r.err) return r.err; const u = r.u[0]; if (close(u, trip[2])) return OK(); if (close(u, trip[0] + trip[1])) return NO("Die Länge ist nicht die Summe der Unterschiede. Nutze den Satz des Pythagoras."); if (close(u, trip[2] ** 2)) return NO("Das ist das Quadrat der Länge. Ziehe noch die Wurzel."); return NO(); },
    hint: "|AB| = √((x_B − x_A)² + (y_B − y_A)²)",
    sol: `x<sub>B</sub> − x<sub>A</sub> = ${N(xb)} ${MINUS} ${P(xa)} = ${N(xb - xa)}; y<sub>B</sub> − y<sub>A</sub> = ${N(yb)} ${MINUS} ${P(ya)} = ${N(yb - ya)}<br>|AB| = √(${P(xb - xa)}${expo(2)} + ${P(yb - ya)}${expo(2)}) = √${N(trip[2] ** 2)} = <b>${N(trip[2])}</b>`,
    answer: [String(trip[2])]
  };
};
T.gp_schnittLaenge = () => {
  const s = schnittPick([0.75, -0.75, 2.4, -2.4, 0], (r1, r2, m) => (Math.abs(m) === 0.75 ? r2 - r1 === 4 : Math.abs(m) === 2.4 ? r2 - r1 === 5 : r2 - r1 >= 2));
  const { r1, r2, m, n, B, C, a } = s, y1 = s.g(r1), y2 = s.g(r2);
  const dx = r2 - r1, dy = y2 - y1, L = Math.hypot(dx, dy);
  return {
    q: `Die Graphen von f(x) = ${poly([[a, 2], [B, 1], [C, 0]])} und g(x) = ${poly([[m, 1], [n, 0]])} schneiden sich in den Punkten A und B. Berechnen Sie die Länge der Strecke AB.`,
    inputs: [{ type: "num", label: "|AB| =" }],
    check: v => { const r = nums(v, 1); if (r.err) return r.err; const u = r.u[0]; if (close(u, L)) return OK(); if (close(u, dx) && dy !== 0) return NO("Die Punkte haben auch verschiedene y-Koordinaten. Nutze den Satz des Pythagoras mit beiden Unterschieden."); if (close(u, L * L)) return NO("Das ist das Quadrat der Länge. Ziehe noch die Wurzel."); return NO(); },
    hint: "Zuerst die Schnittpunkte bestimmen (gleichsetzen, pq-Formel, y-Werte mit g). Dann |AB| = √((x_B − x_A)² + (y_B − y_A)²).",
    sol: `${schnittRechnung(s)}<br>A(${N(r1)} | ${N(y1)}); B(${N(r2)} | ${N(y2)})<br>|AB| = √(${N(dx)}${expo(2)} + ${P(dy)}${expo(2)}) = √${N(dx * dx + dy * dy)} = <b>${N(L)}</b>`,
    answer: [String(L)]
  };
};
T.cas_schnitt = () => {
  let A, B, C, m, n, disc, x1, x2, f, g;
  const ugly = x => Math.abs(x * 4 - Math.round(x * 4)) > 0.05;
  do {

function buildInputs(form, inputs, vals, onChange, disabled) {
  const getters = []; let k = 0;
  const mkField = (cls, aria) => {
    const i = document.createElement("input"); i.className = "fld " + cls; i.type = "text"; i.autocomplete = "off";

    const myK = k++; i.value = vals[myK] ?? ""; i.addEventListener("input", onChange); if (disabled) i.disabled = true;
    getters.push(() => i.value); return i;
  };
  for (const inp of inputs) {

      const lab = h("label", "fi" + (inp.type === "term" ? " fi-term" : ""));

      if (inp.type === "term") {
        const pv = h("div", "prev");

        f.addEventListener("input", up); up(); form.appendChild(pv);
      }
    } else if (inp.type === "pt") {
      const g = h("div", "fi fi-pt"); g.appendChild(h("span", "fl", inp.label + "("));
      g.appendChild(mkField("num", inp.label + ", x-Koordinate")); g.appendChild(h("span", "fl bar", "|")); g.appendChild(mkField("num", inp.label + ", y-Koordinate")); g.appendChild(h("span", "fl", ")"));
      form.appendChild(g);
    } else if (inp.type === "choice") {
      const myK = k++; let cur = vals[myK] ?? "";
      const box = h("div", "chs"); if (inp.label) box.appendChild(h("div", "chs-l", inp.label));
      const list = h("div", "chs-o" + (inp.opts.length <= 3 && inp.opts.every(o => stripTags(o).length <= 4) ? " row" : "")); list.setAttribute("role", "radiogroup"); list.setAttribute("aria-label", stripTags(inp.label || "Antwort"));
      const bs = inp.opts.map((o, i) => {

        b.setAttribute("role", "radio"); b.setAttribute("aria-checked", cur === String(i) ? "true" : "false"); if (disabled) b.disabled = true; list.appendChild(b); return b;
      });
      box.appendChild(list); form.appendChild(box); getters.push(() => cur);
    }
  }
  return { get: () => getters.map(g => g()) };
}

    card.appendChild(head);

      fb.innerHTML = (r.ok ? "✓ " : "✗ ") + r.msg + (r.ok && slot.rev ? " <span class='muted'>Du hattest die Lösung schon angesehen. Für das Häkchen: Neue Zahlen.</span>" : "");
      card.classList.toggle("is-ok", r.ok);

      save();

    card._check = check;
    const bar = h("div", "btns");

    <li>Zum Schluss: der <b>Abschlusstest</b> wie in der Klausur, Teil A ohne Hilfsmittel, Teil B mit GeoGebra CAS.</li></ol>
    <p class="muted">Eingabe: Zahlen mit Komma oder als Bruch, zum Beispiel −2,5 oder 3/4. Terme mit x und ^ für Exponenten, zum Beispiel 2(x − 3)^2 + 1. Punkte trägst du als x- und y-Koordinate getrennt ein.</p>`;
  main.appendChild(how);
  const grid = h("section", "st-grid");
  STATIONS.forEach((st, j) => {
    const n = st.tasks.filter(g => store.solved[g]).length, done = n === st.tasks.length;
    const c = btn("st-card" + (done ? " done" : ""), `<span class="st-n">Station ${j + 1}</span><span class="st-t">${st.title}</span><span class="st-s">${st.sub}</span><span class="st-bar"><span style="width:${Math.round(100 * n / st.tasks.length)}%"></span></span><span class="st-c">${done ? "✓ geschafft" : `${n} von ${st.tasks.length} Aufgaben`}</span>`, () => go(j + 1));
    grid.appendChild(c);
  });
  const tc = btn("st-card test" + (store.test && store.test.done ? " done" : ""), `<span class="st-n">Zum Schluss</span><span class="st-t">Abschlusstest</span><span class="st-s">12 Aufgaben wie in der Klausur</span><span class="st-c">${store.test && store.test.done ? `Letzter Test: ${store.test.score} von 12` : "noch nicht bearbeitet"}</span>`, () => go(11));
  grid.appendChild(tc);
  main.appendChild(grid);
  const set = h("section", "card settings");
  set.innerHTML = `<h2 class="card-t">Einstellungen</h2>`;
  segmented(set, "Tastatur", [["app", "Rechentastatur dieser Seite"], ["ios", "Tastatur des iPads"]], store.kb, v => setKb(v));
  set.appendChild(h("p", storageOk ? "muted" : "t-no", storageOk ? "Dein Fortschritt wird nur auf diesem Gerät in diesem Browser gespeichert." : "Dieser Browser speichert deinen Fortschritt gerade nicht, zum Beispiel im privaten Modus. Beim Schließen der Seite geht er verloren."));
  const resetRow = h("div", "btns");
  const rb = btn("b-sec", "Fortschritt zurücksetzen", () => { resetRow.replaceChildren(h("span", "", "Wirklich alles löschen?"), btn("b-warn", "Ja, zurücksetzen", () => { store = { v: DATA_VERSION, cur: 0, solved: {}, slots: {}, test: null, game: { level: 1, mode: "graph", hits: {} }, kb: store.kb }; save(); render(); }), btn("b-sec", "Abbrechen", () => render())); });
  resetRow.appendChild(rb); set.appendChild(resetRow);
  main.appendChild(set);
}
function renderStation(main, i) {
  const st = STATIONS[i - 1];
  const sec = h("section", "station");
  sec.appendChild(h("div", "st-head", `<p class="kicker">Station ${i} von ${STATIONS.length}</p><h1>${st.title}</h1><p class="lead">${st.sub}</p>`));
  sec.appendChild(h("div", "merke", `<div class="merke-t">Merke</div><ul>${st.merke.map(m => `<li>${m}</li>`).join("")}</ul>`));
  const ex = h("section", "card explore"); ex.appendChild(h("h2", "card-t", "Ausprobieren"));
  sec.appendChild(ex); main.appendChild(sec);
  st.ex(ex);
  if (st.obs) obsBlock(ex, st.obs);
  if (st.extra) st.extra(sec);
  const th = h("div", "tasks-h"); const prog = h("span", "muted");
  const upd = () => { const n = st.tasks.filter(g => store.solved[g]).length; prog.textContent = n === st.tasks.length ? "✓ Station geschafft" : `${n} von ${st.tasks.length} gelöst`; renderNav(); };
  th.append(h("h2", "", "Aufgaben"), prog); sec.appendChild(th);
  const list = h("div", "tasks");
  st.tasks.forEach((g, k) => list.appendChild(taskCard(g, k + 1, upd)));
  sec.appendChild(list); upd();
  const nav = h("div", "st-nav");
  nav.append(btn("b-sec", i === 1 ? "← Start" : `← Station ${i - 1}`, () => go(i - 1)), btn("b-pri", i === STATIONS.length ? "Zum Abschlusstest →" : `Station ${i + 1} →`, () => go(i + 1)));
  sec.appendChild(nav);
}

/* ---------- Abschlusstest ---------- */
const TEST_PLAN = [
  ["A", ["fb_def", "fb_werte", "fb_stellen"]], ["A", ["li_zweiPunkte", "li_null"]], ["A", ["qf_scheitel", "qf_ergaenz", "qf_ausSP"]], ["A", ["ns_pq", "ns_ohnePQ", "ns_anzahl"]],
  ["A", ["po_symdef", "po_verlauf", "po_faktor", "po_wert"]], ["A", ["vs_term", "vs_asym", "st_punkt", "st_beide"]], ["A", ["tr_term", "tr_kette", "tr_beschr"]], ["A", ["gp_strecke", "gv_abstand", "li_deuten"]],
  ["B", ["cas_max", "cas_schnitt"]], ["B", ["gv_maxabst", "gp_schnittLaenge", "gp_schnitt"]], ["B", ["gv_bereich"]], ["B", ["gp_param"]]
];
function newTest() {
  const mix = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const mk = ([part, pool]) => ({ gen: pool[Math.floor(Math.random() * pool.length)], seed: newSeed(), part, vals: [] });
  store.test = { items: mix(TEST_PLAN.filter(p => p[0] === "A")).map(mk).concat(mix(TEST_PLAN.filter(p => p[0] === "B")).map(mk)), done: false, score: null }; save();
}
function renderTest(main) {
  if (!store.test || !store.test.items) newTest();
  const te = store.test;
  const sec = h("section", "station test");
  sec.appendChild(h("div", "st-head", `<p class="kicker">Zum Schluss</p><h1>Abschlusstest</h1><p class="lead">12 Aufgaben wie in der Klausur. Teil A ohne Hilfsmittel, Teil B mit GeoGebra CAS. Plane etwa 45 Minuten ein. Während des Tests gibt es keine Tipps. Erst am Ende siehst du Ergebnis und Lösungen.</p><p class="lead">Schreibe in Teil B wie in der Klausur Ansatz, Eingabe, Ergebnis und Deutung auf, zum Beispiel in GoodNotes. Hier werden nur die Ergebnisse geprüft.</p>`));
  main.appendChild(sec);
  if (te.done) {
    const wrong = te.items.map((it, i) => [it, i]).filter(([it]) => !it.ok);
    const cnt = {}; wrong.forEach(([it]) => { const s = stationOf(it.gen); cnt[s] = (cnt[s] || 0) + 1; });
    const rec = Object.keys(cnt).map(Number).sort((x, y) => cnt[y] - cnt[x] || x - y).slice(0, 3);
    const res = h("section", "card result");
    res.innerHTML = `<h2 class="card-t">Ergebnis: ${te.score} von 12 Aufgaben richtig</h2><p>${te.score >= 10 ? "In diesem Test warst du sehr sicher. Schau dir trotzdem die Lösungen deiner Fehler an." : te.score >= 7 ? "Eine gute Grundlage. Wiederhole gezielt die Stationen unten." : "Arbeite die empfohlenen Stationen noch einmal durch und mache danach einen neuen Test."}</p>`;
    if (rec.length) { res.appendChild(h("p", "", "<b>Wiederhole diese Stationen:</b>")); const r = h("div", "btns"); rec.forEach(k => r.appendChild(btn("b-sec", `Station ${k}: ${STATIONS[k - 1].title}`, () => go(k)))); res.appendChild(r); }
    const again = h("div", "btns"); again.appendChild(btn("b-pri", "Neuen Test erstellen", () => { newTest(); render(); })); res.appendChild(again);
    sec.appendChild(res);
  }
  let partShown = "";
  te.items.forEach((it, i) => {
    if (it.part !== partShown) { partShown = it.part; sec.appendChild(h("h2", "part-h", it.part === "A" ? "Teil A: ohne Hilfsmittel" : "Teil B: mit GeoGebra CAS")); }
    const t = withSeed(it.seed, T[it.gen]);
    const card = h("article", "task" + (te.done ? (it.ok ? " is-ok" : " is-no") : ""));
    const head = h("div", "task-h"); head.appendChild(h("span", "task-nr", `Aufgabe ${i + 1}`)); if (t.cas) head.appendChild(h("span", "pill cas", "mit GeoGebra CAS"));
    if (te.done) head.appendChild(h("span", "pill " + (it.ok ? "done" : "bad"), it.ok ? "✓ richtig" : "✗ nicht richtig"));
    card.appendChild(head); card.appendChild(h("div", "task-q", t.q));
    const form = h("div", "task-in");
    const fields = buildInputs(form, t.inputs, it.vals || [], () => { it.vals = fields.get(); saveSoon(); }, te.done);
    card.appendChild(form);
    if (te.done) {
      if (!it.ok) card.appendChild(h("div", "fb no", "✗ " + it.msg));
      const sol = h("div", "sol", `<span class="lab">Lösung</span>${t.sol}`); card.appendChild(sol);
      card.appendChild(h("p", "muted small", `Passende Station: ${stationOf(it.gen)} ${STATIONS[stationOf(it.gen) - 1].title}`));
    }
    sec.appendChild(card);
  });
  if (!te.done) {
    const row = h("div", "btns end");
    const evalNow = () => {
      te.items.forEach(it => {
        const t = withSeed(it.seed, T[it.gen]), vals = it.vals || [];
        if (!vals.some(v => String(v).trim() !== "")) { it.ok = false; it.msg = "Nicht bearbeitet."; return; }
        const r = t.check(vals); it.ok = r.ok; it.msg = r.msg;
      });
      te.score = te.items.filter(it => it.ok).length; te.done = true; save(); render(); window.scrollTo({ top: 0 });
    };
    const ask = () => {
      const empty = te.items.filter(it => !(it.vals || []).some(v => String(v).trim() !== "")).length;
      if (!empty) { evalNow(); return; }
      row.replaceChildren(h("span", "", `${empty} ${empty === 1 ? "Aufgabe ist" : "Aufgaben sind"} noch leer. Trotzdem auswerten?`), btn("b-pri", "Ja, auswerten", evalNow), btn("b-sec", "Weiter bearbeiten", () => { row.replaceChildren(btn("b-pri big", "Test auswerten", ask)); }));
    };
    row.appendChild(btn("b-pri big", "Test auswerten", ask));
    sec.appendChild(row);
  }
}

/* ---------- Rechentastatur ---------- */
const KP = { target: null };
const KEYS = [["7", "8", "9", "(", ")", "x", "²", "del"], ["4", "5", "6", "/", "·", "^", "³", "left"], ["1", "2", "3", "−", "+", "√", ",", "right"], ["0", "ios", "next", "check", "done"]];
const KEYLAB = { del: "⌫", left: "←", right: "→", ios: "⌨", next: "Nächstes Feld", check: "Prüfen", done: "Fertig" };
const KEYARIA = { del: "Löschen", left: "Cursor nach links", right: "Cursor nach rechts", ios: "Tastatur des iPads verwenden", "/": "geteilt durch, Bruchstrich", "·": "mal", "^": "hoch", "√": "Wurzel", "²": "hoch 2", "³": "hoch 3", "−": "minus" };
function kpInit() {
  const el = $("#kp"), inner = h("div", "kp-in");
  for (const row of KEYS) for (const k of row) {
    const wide = ["next", "check", "done"].includes(k);
    const b = btn("k" + (wide ? " s2 k-fn" : "") + (k === "check" ? " k-pri" : "") + (["del", "left", "right", "ios"].includes(k) ? " k-fn" : ""), KEYLAB[k] || k, null, KEYARIA[k] || KEYLAB[k] || k);
    b.dataset.k = k; inner.appendChild(b);
  }
  el.appendChild(inner);
  el.addEventListener("pointerdown", e => { const b = e.target.closest("button"); if (!b) return; e.preventDefault(); kpPress(b.dataset.k); });
  /* Aktivierung per Tastatur (Enter oder Leertaste auf einer Taste): click ohne Zeigerereignis */
  el.addEventListener("click", e => { e.preventDefault(); const b = e.target.closest("button"); if (b && e.detail === 0) kpPress(b.dataset.k); });
  document.addEventListener("focusin", e => { const t = e.target; if (t && t.classList && t.classList.contains("fld") && store.kb === "app" && !t.disabled) kpShow(t); });
  document.addEventListener("pointerdown", e => { if (!KP.target) return; if (e.target.closest("#kp") || e.target.closest(".fld")) return; kpHide(); }, true);
  document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.classList && e.target.classList.contains("fld")) { const c = e.target.closest(".task"); if (c && c._check) { e.preventDefault(); c._check(); } } });
}
function kpShow(f) {
  KP.target = f; const el = $("#kp"); el.hidden = false; document.body.classList.add("kp-open"); el.classList.toggle("im-test", !!f.closest(".test"));
  requestAnimationFrame(() => { const r = f.getBoundingClientRect(), kh = el.offsetHeight, free = window.innerHeight - kh - 16; if (r.bottom > free) window.scrollBy({ top: r.bottom - free + 8, behavior: reduced() ? "auto" : "smooth" }); });
}
function kpHide() { KP.target = null; const el = $("#kp"); if (el) el.hidden = true; document.body.classList.remove("kp-open"); }
function kpPress(k) {
  const f = KP.target; if (!f) return;
  const s = f.selectionStart ?? f.value.length, e2 = f.selectionEnd ?? s;
  const fire = () => f.dispatchEvent(new Event("input", { bubbles: true }));
  switch (k) {
    case "del": if (s !== e2) f.setRangeText("", s, e2, "end"); else if (s > 0) f.setRangeText("", s - 1, s, "end"); fire(); break;
    case "left": f.setSelectionRange(Math.max(0, s - 1), Math.max(0, s - 1)); break;
    case "right": f.setSelectionRange(Math.min(f.value.length, e2 + 1), Math.min(f.value.length, e2 + 1)); break;
    case "done": kpHide(); f.blur(); return;
    case "check": { const c = f.closest(".task"); if (c && c._check) c._check(); break; }
    case "next": { const all = [...document.querySelectorAll(".fld:not([disabled])")], i = all.indexOf(f); if (i >= 0 && i < all.length - 1) { all[i + 1].focus(); return; } kpHide(); f.blur(); return; }
    case "ios": setKb("ios"); kpHide(); f.blur(); setTimeout(() => f.focus(), 60); return;
    case "√": f.setRangeText("√(", s, e2, "end"); fire(); break;
    default: f.setRangeText(k, s, e2, "end"); fire();
  }
  f.focus({ preventScroll: true });
}
function setKb(v) {
  store.kb = v; save();
  document.querySelectorAll(".fld").forEach(f => f.setAttribute("inputmode", v === "ios" ? "text" : "none"));
  const t = $("#kbt"); if (t) t.textContent = v === "ios" ? "Eingabe: iPad-Tastatur" : "Eingabe: Rechentastatur";
  if (v === "ios") kpHide();
}

/* ---------- Start ---------- */
function boot() {
  load();
  try { localStorage.setItem(KEY + "-probe", "1"); localStorage.removeItem(KEY + "-probe"); } catch (e) { storageOk = false; }
  window.addEventListener("pagehide", save);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") save(); });
  const hash = (location.hash || "").replace("#", "");
  const m = /^s(\d{1,2})$/.exec(hash);
  if (m && +m[1] >= 1 && +m[1] <= STATIONS.length) store.cur = +m[1]; else if (hash === "test") store.cur = 11; else if (hash === "start") store.cur = 0;
  if (!(store.cur >= 0 && store.cur <= 11)) store.cur = 0;
  kpInit();
  const kbt = $("#kbt"); kbt.textContent = store.kb === "ios" ? "Eingabe: iPad-Tastatur" : "Eingabe: Rechentastatur";
  kbt.addEventListener("click", () => setKb(store.kb === "ios" ? "app" : "ios"));
  render();
}
boot();
